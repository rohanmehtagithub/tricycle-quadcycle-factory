            if (text !== undefined && text !== null) node.textContent = text;
            sv.appendChild(node);
            return node;
        }
        function clearSvg(){ while (sv.firstChild) sv.removeChild(sv.firstChild); }
        function findRydbergIntervalAt(timeNow){
            for (const itv of DATA.rydberg_intervals) if (timeNow >= itv[0] && timeNow < itv[1]) return itv;
            return null;
        }
        function findNextRydbergBegin(timeNow){
            for (const itv of DATA.rydberg_intervals) if (itv[0] > timeNow) return itv[0];
            return DATA.runtime;
        }
        function advanceTime(timeNow, frameUnits){
            let tNow = timeNow;
            let remaining = Math.max(0, frameUnits);
            const eps = 1e-9;
            while (remaining > eps && tNow < DATA.runtime - eps) {
                const inRydberg = findRydbergIntervalAt(tNow);
                const inIntro = DATA.intro && tNow < DATA.intro.end;
                const usPerFrame = inIntro ? DATA.intro.end / (DATA.intro.hold_s * DATA.fps)
                    : (inRydberg ? DATA.mus_per_frame_slow : DATA.mus_per_frame);
                const boundary = inIntro ? DATA.intro.end
                    : (inRydberg ? inRydberg[1] : findNextRydbergBegin(tNow));
                const timeLeft = Math.max(0, Math.min(boundary, DATA.runtime) - tNow);
                const framesToBoundary = timeLeft / usPerFrame;
                if (framesToBoundary <= eps) { tNow = boundary; continue; }
                const stepFrames = Math.min(remaining, framesToBoundary);
                tNow += stepFrames * usPerFrame;
                remaining -= stepFrames;
            }
            return clamp(tNow, 0, DATA.runtime);
        }
        function setDisplayScale(s){
            displayScale = s;
            sv.style.width = `${Math.round(baseWidth * displayScale)}px`;
            sv.style.height = `${Math.round(baseHeight * displayScale)}px`;
            dTxt.textContent = `${displayScale.toFixed(1)}x`;
        }
        function compact(vals, maxItems = 6){
            if (!Array.isArray(vals) || vals.length === 0) return '';
            const fixed = vals.map(v => Number(v).toFixed(2));
            if (fixed.length <= maxItems) return fixed.join(',');
            return `${fixed.slice(0, maxItems).join(',')},...(${fixed.length})`;
        }
        function moveCommand(detail, aodId, active){
            const marker = active ? '>> ' : '   ';
            const dur = Math.max(0, Number(detail.end_time) - Number(detail.begin_time));
            return `${marker}MoveAOD[aod=${aodId}, From[[${compact(detail.col_x_begin)}],[${compact(detail.row_y_begin)}]], To[[${compact(detail.col_x_end)}],[${compact(detail.row_y_end)}]], ${dur.toFixed(2)} us]`;
        }
        function applyMove(q, detail, ratio){
            for (let rr = 0; rr < detail.begin_coord.length; rr++) {
                const bRow = detail.begin_coord[rr];
                const eRow = detail.end_coord[rr];
                for (let i = 0; i < bRow.length; i++) {
                    const b = bRow[i], e = eRow[i], key = String(b.id);
                    q[key] = [lerpSmooth(ratio, b.x, e.x), lerpSmooth(ratio, b.y, e.y)];
                }
            }
        }
        function ensureAod(aod, aid, colId, rowId){
            if (!(aid in aod)) aod[aid] = { cols: [], rows: [] };
            while (aod[aid].cols.length <= colId && colId >= 0) aod[aid].cols.push({x:0, alpha:0});
            while (aod[aid].rows.length <= rowId && rowId >= 0) aod[aid].rows.push({y:0, alpha:0});
        }
        function currentMeta(timeNow){
            // base qubit metadata, with any recolor/relabel instructions applied up to timeNow
            const meta = {};
            for (const [k, v] of Object.entries(DATA.qubits)) meta[k] = {color:v.color, sector:v.sector, kind:v.kind, hidden:false};
            for (const inst of DATA.instructions) {
                if (inst.type !== 'recolor' || timeNow < inst.begin_time) continue;
                for (const ch of inst.changes) {
                    const key = String(ch.id);
                    if (!meta[key]) meta[key] = {color:'#cccccc', sector:'', kind:'Q', hidden:false};
                    if ('color' in ch) meta[key].color = ch.color;
                    if ('sector' in ch) meta[key].sector = ch.sector;
                    if ('hidden' in ch) meta[key].hidden = ch.hidden;
                }
            }
            return meta;
        }
        function getState(timeNow){
            const q = {};
            for (const it of DATA.init_positions) q[String(it[0])] = [it[1], it[2]];
            const aod = {'0': {cols: [], rows: []}, '1': {cols: [], rows: []}};
            let flash = null;
            const activePairs = [];
            const commandByAod = {'0': 'MoveAOD[aod=0, idle]', '1': 'MoveAOD[aod=1, idle]'};
            let text = 'idle';

            for (const inst of DATA.instructions.slice(1)) {
                if (timeNow < inst.begin_time) continue;
                if (inst.type === 'rydberg' || inst.type === 'measure') {
                    if (timeNow < inst.end_time) {
                        if (inst.type === 'rydberg') activePairs.push(...(inst.interaction_pairs || []));
                        flash = {color: inst.flash_color || '0,0,255', rect: inst.flash_rect || null};
                        text = `inst:${inst.id} ${inst.type} ${inst.term_label || ''}`;
                    }
                    continue;
                }
                if (inst.type !== 'rearrangeJob') continue;
                const aid = String(inst.aod_id);
                if (timeNow >= inst.end_time) {
                    for (const detail of inst.insts) if (detail.type === 'move') applyMove(q, detail, 1.0);
                    continue;
                }
                text = `inst:${inst.id}; ${inst.note || 'rearrange'}`;
                for (const detail of inst.insts) {
                    if (!('begin_time' in detail) || !('end_time' in detail)) continue;
                    if (timeNow >= detail.end_time) {
                        if (detail.type === 'move') applyMove(q, detail, 1.0);
                        continue;
                    }
                    if (timeNow < detail.begin_time) continue;
                    const r = clamp((timeNow - detail.begin_time) / Math.max(1e-9, detail.end_time - detail.begin_time), 0, 1);
                    if (detail.type === 'activate') {
                        for (let i = 0; i < detail.col_id.length; i++) {
                            const id = detail.col_id[i]; ensureAod(aod, aid, id, -1);
                            aod[aid].cols[id].x = detail.col_x[i];
                            aod[aid].cols[id].alpha = Math.max(aod[aid].cols[id].alpha, 0.7 * r);
                        }
                        for (let i = 0; i < detail.row_id.length; i++) {
                            const id = detail.row_id[i]; ensureAod(aod, aid, -1, id);
                            aod[aid].rows[id].y = detail.row_y[i];
                            aod[aid].rows[id].alpha = Math.max(aod[aid].rows[id].alpha, 0.7 * r);
                        }
                    } else if (detail.type === 'deactivate') {
                        for (const id of detail.col_id) { ensureAod(aod, aid, id, -1); aod[aid].cols[id].alpha = Math.max(aod[aid].cols[id].alpha, 0.7 * (1-r)); }
                        for (const id of detail.row_id) { ensureAod(aod, aid, -1, id); aod[aid].rows[id].alpha = Math.max(aod[aid].rows[id].alpha, 0.7 * (1-r)); }
                    } else if (detail.type === 'move') {
                        applyMove(q, detail, r);
                        commandByAod[aid] = moveCommand(detail, aid, true);
                        for (let i = 0; i < detail.col_id.length; i++) {
                            const id = detail.col_id[i]; ensureAod(aod, aid, id, -1);
                            aod[aid].cols[id].x = lerpSmooth(r, detail.col_x_begin[i], detail.col_x_end[i]);
                            aod[aid].cols[id].alpha = Math.max(aod[aid].cols[id].alpha, 0.7);
                        }
                        for (let i = 0; i < detail.row_id.length; i++) {
                            const id = detail.row_id[i]; ensureAod(aod, aid, -1, id);
                            aod[aid].rows[id].y = lerpSmooth(r, detail.row_y_begin[i], detail.row_y_end[i]);
                            aod[aid].rows[id].alpha = Math.max(aod[aid].rows[id].alpha, 0.7);
                        }
                    }
                }
            }
            return {q, aod, activePairs, text, commandByAod, flash};
        }
        const CAPTION_STYLE = {fill:'#000000', 'font-family':'system-ui, sans-serif',
            'text-anchor':'middle', 'dominant-baseline':'central',
            stroke:'#ffffff', 'stroke-width':6, 'stroke-linejoin':'round', 'paint-order':'stroke'};
        let captionFs = 0;
        function captionSize(){
            // one size for every caption: the widest line fills the box's width
            // and the tallest stack its height (measured once, in the live font)
            if (captionFs) return captionFs;
            const C = DATA.captions, b = C.box, probe = 100;
            let wMax = 0, nMax = 1;
            for (const ph of C.phases) {
                nMax = Math.max(nMax, ph.lines.length);
                for (const line of ph.lines) {
                    const n = addSvg('text', {...CAPTION_STYLE, 'font-size':probe}, line);
                    wMax = Math.max(wMax, n.getComputedTextLength());
                    sv.removeChild(n);
                }
            }
            if (!wMax) return 40;          // not laid out yet: guess, measure next time
            const W = x2c(b[2]) - x2c(b[0]), H = y2c(b[1]) - y2c(b[3]);
            captionFs = Math.min(probe * C.fill * W / wMax, C.fill * H / (nMax * C.leading));
            return captionFs;
        }
        function draw(timeNow){
            const st = getState(timeNow);
            clearSvg();
            if (st.flash) {
                let rx, ry, rw = 0, rh = 0;
                if (st.flash.rect) {
                    rx = x2c(st.flash.rect[0]); ry = y2c(st.flash.rect[1] + st.flash.rect[3]);
                    rw = x2c(st.flash.rect[0] + st.flash.rect[2]) - rx; rh = y2c(st.flash.rect[1]) - ry;
                } else {
                    const xs = [], ys = [];
                    for (const p of st.activePairs) { const a = st.q[String(p.data_id)], b = st.q[String(p.check_id)]; if (a){xs.push(a[0]);ys.push(a[1]);} if (b){xs.push(b[0]);ys.push(b[1]);} }
                    if (xs.length) { const pd = 5; const x0 = Math.min(...xs)-pd, x1 = Math.max(...xs)+pd, y0 = Math.min(...ys)-pd, y1 = Math.max(...ys)+pd; rx = x2c(x0); ry = y2c(y1); rw = x2c(x1)-rx; rh = y2c(y0)-ry; }
                }
                if (rw) addSvg('rect', {x:rx, y:ry, width:rw, height:rh, fill:`rgba(${st.flash.color},0.18)`, stroke:'none'});
            }
            for (const [aid, streams] of Object.entries(st.aod)) {
                const color = AOD_COLORS[Number(aid) % AOD_COLORS.length];
                for (const c of streams.cols) if (c.alpha > 0) addSvg('line', {x1:x2c(c.x), y1:0, x2:x2c(c.x), y2:baseHeight, stroke:`rgba(${color},${c.alpha})`, 'stroke-width':1, 'stroke-dasharray':'4 4'});
                for (const r of streams.rows) if (r.alpha > 0) addSvg('line', {x1:0, y1:y2c(r.y), x2:baseWidth, y2:y2c(r.y), stroke:`rgba(${color},${r.alpha})`, 'stroke-width':1, 'stroke-dasharray':'4 4'});
            }
            for (const p of DATA.slm_sites) addSvg('circle', {cx:x2c(p[0]), cy:y2c(p[1]), r:2.2, fill:'#dddddd', stroke:'#bbbbbb', 'stroke-width':0.6});
            for (const pair of st.activePairs) {
                const a = st.q[String(pair.data_id)], b = st.q[String(pair.check_id)];
                if (!a || !b) continue;
                addSvg('line', {x1:x2c(a[0]), y1:y2c(a[1]), x2:x2c(b[0]), y2:y2c(b[1]), stroke:'rgba(0,0,255,0.60)', 'stroke-width':2});
            }
            const cmeta = currentMeta(timeNow);
            for (const [qidStr, p] of Object.entries(st.q)) {
                const base = DATA.qubits[qidStr]; const meta = cmeta[qidStr] || base;
                if (meta.hidden) continue;
                const cx = x2c(p[0]), cy = y2c(p[1]);
                if (base.shape === 'square') addSvg('rect', {x:cx-3.4, y:cy-3.4, width:6.8, height:6.8, fill:meta.color, stroke:'none'});
                else addSvg('circle', {cx, cy, r:3.6, fill:meta.color, stroke:'none'});
            }
            for (const [qidStr, p] of Object.entries(st.q)) {
                const base = DATA.qubits[qidStr]; const meta = cmeta[qidStr] || base;
                if (meta.hidden || !meta.sector) continue;
                const label = `${meta.sector}(${base.i},${base.j})`;
                const dy = base.kind === 'Q' ? 8 : -8;
                addSvg('text', {x:x2c(p[0]), y:y2c(p[1])+dy, fill:meta.color, 'font-size':6.5, 'font-family':'sans-serif', 'text-anchor':'middle', 'dominant-baseline':'middle'}, label);
            }
            for (const label of DATA.block_labels) addSvg('text', {x:x2c(label[1]), y:y2c(label[2]), fill:'#222222', 'font-size':13, 'font-family':'sans-serif', 'font-weight':'600', ...(label[3] || {})}, label[0]);
            if (DATA.axes) {
                const A = DATA.axes, ox = A.o[0], oy = A.o[1], L = A.len, col = '#333333';
                const ax = (x1, y1, x2, y2) => addSvg('line', {x1, y1, x2, y2, stroke:col,
                    'stroke-width':2, 'stroke-linecap':'round'});
                const head = (px, py, dx, dy) => addSvg('polygon', {points:
                    `${px},${py} ${px + dx - dy*0.5},${py + dy + dx*0.5} ${px + dx + dy*0.5},${py + dy - dx*0.5}`,
                    fill:col});
                const O = [x2c(ox), y2c(oy)];
                // +x (world) -> UP on screen
                const tipX = [x2c(ox), y2c(oy + L)];
                ax(O[0], O[1], tipX[0], tipX[1]);
                head(tipX[0], tipX[1], 0, 9);
                addSvg('text', {x:tipX[0] + 6, y:tipX[1] + 4, fill:col, 'font-size':12,
                    'font-family':'sans-serif', 'font-weight':'700'}, A.x_label);
                // +y (world) -> LEFT on screen
                const tipY = [x2c(ox - L), y2c(oy)];
                ax(O[0], O[1], tipY[0], tipY[1]);
                head(tipY[0], tipY[1], 9, 0);
                addSvg('text', {x:tipY[0] - 4, y:tipY[1] + 16, fill:col, 'font-size':12,
                    'font-family':'sans-serif', 'font-weight':'700'}, A.y_label);
                addSvg('circle', {cx:O[0], cy:O[1], r:2.6, fill:col});
                addSvg('text', {x:O[0] + 5, y:O[1] + 14, fill:col, 'font-size':10,
                    'font-family':'sans-serif'}, A.origin_label);
            }
            if (DATA.intro && timeNow < DATA.intro.end) {
                // intro: thin black lines between the patches, one unit cell boxed per patch
                const ink = {stroke:'#000000', 'stroke-width':1.6, fill:'none'};
                for (const u of DATA.intro.separators)
                    addSvg('line', {x1:x2c(u), y1:0, x2:x2c(u), y2:baseHeight, ...ink, 'stroke-opacity':0.4});
                for (const c of DATA.intro.cells)
                    addSvg('rect', {x:x2c(c[0]), y:y2c(c[3]), width:x2c(c[2]) - x2c(c[0]),
                        height:y2c(c[1]) - y2c(c[3]), rx:3, ...ink});
            } else if (DATA.captions) {
                const C = DATA.captions;
                const ph = C.phases.find(p => timeNow >= p.begin && timeNow < p.end);
                if (ph) {
                    const fs = captionSize(), b = C.box;
                    const cx = (x2c(b[0]) + x2c(b[2])) / 2, cy = (y2c(b[1]) + y2c(b[3])) / 2;
                    ph.lines.forEach((line, k) => addSvg('text', {...CAPTION_STYLE, 'font-size':fs,
                        x:cx, y:cy + (k - (ph.lines.length - 1) / 2) * fs * C.leading}, line));
                }
            }
            info.textContent = `time=${timeNow.toFixed(2)}us | ${st.text}`;
            commandsBox.innerHTML = `<span style="color:rgb(${AOD_COLORS[0]})">${st.commandByAod['0']}</span><br/><span style="color:rgb(${AOD_COLORS[1]})">${st.commandByAod['1']}</span>`;
        }
        function raf(ts){
            if (!playing) return;
            if (lastTs === null) lastTs = ts;
            const dt = (ts - lastTs) / 1000;
            lastTs = ts;
            t = advanceTime(t, dt * DATA.fps * speed);
            tSlider.value = t;
            draw(t);
            if (t < DATA.runtime) requestAnimationFrame(raf);
            else { playing = false; lastTs = null; playPauseBtn.textContent = 'Play'; }
        }
        const playPauseBtn = document.getElementById('playPause');
        playPauseBtn.onclick = () => {
            if (!playing) { playing = true; playPauseBtn.textContent = 'Pause'; requestAnimationFrame(raf); }
            else { playing = false; lastTs = null; playPauseBtn.textContent = 'Play'; }
        };
        document.getElementById('reset').onclick = () => { playing = false; lastTs = null; playPauseBtn.textContent = 'Play'; t = 0; tSlider.value = 0; draw(0); };
        tSlider.oninput = e => { t = Number(e.target.value); draw(t); };
        sSlider.oninput = e => { speed = Number(e.target.value); sTxt.textContent = `${speed.toFixed(1)}x`; };
        dSlider.oninput = e => setDisplayScale(Number(e.target.value));
        function instructionTimes(){
            const times = new Set([0]);
            for (const inst of DATA.instructions) { if ('begin_time' in inst) times.add(inst.begin_time); if ('end_time' in inst) times.add(inst.end_time); }
            return Array.from(times).sort((a,b) => a-b);
        }
        function stepFrame(direction){
            playing = false; lastTs = null; playPauseBtn.textContent = 'Play';
            const frameTime = findRydbergIntervalAt(t) ? DATA.mus_per_frame_slow : DATA.mus_per_frame;
            t = clamp(t + direction * frameTime, 0, DATA.runtime); tSlider.value = t; draw(t);
        }
        function stepInstruction(direction){
            playing = false; lastTs = null; playPauseBtn.textContent = 'Play';
            const times = instructionTimes();
            if (direction > 0) { for (const time of times) if (time > t + 0.001) { t = time; break; } }
            else { for (let i = times.length - 1; i >= 0; i--) if (times[i] < t - 0.001) { t = times[i]; break; } }
            tSlider.value = t; draw(t);
        }
        document.getElementById('framePrev').onclick = () => stepFrame(-1);
        document.getElementById('frameNext').onclick = () => stepFrame(1);
        document.getElementById('instPrev').onclick = () => stepInstruction(-1);
        document.getElementById('instNext').onclick = () => stepInstruction(1);
        setDisplayScale(1.0);
        draw(0);
    </script>
</body>
</html>
